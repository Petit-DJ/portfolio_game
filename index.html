<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portfolio_game</title>
  </head>
  <body>
    <style>
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;

      }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #textbox-container {
        position: absolute;
        bottom: 10px;
        left: 10%;
        right: 10%;
        background: white;
        padding: 10px;
        z-index: 10;
        pointer-events: auto;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="ui">
        <p class="note">Tap/click around to move</p>
        <div id="textbox-container" style="display:none">
          <div class="textbox">
            <p id="dialogue"></p>
            <div class="btn-container">
              <button id="close" class="ui-close-btn">Close</button>
            </div>
          </div>
      </div>
      
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
